; Production PHP settings for the ERP image.

memory_limit = 512M
; The monthly attendance register is employees × days and the payroll variance
; report streams via LazyCollection — but dompdf renders a payslip fully in
; memory, which is what actually sets this floor.

max_execution_time = 300
post_max_size = 20M
upload_max_filesize = 20M
; ZKTeco CSV imports and employee document uploads (NID scans, contracts).

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; Container convention: logs go to the Docker log driver, not a file inside a
; layer nobody will look at.

date.timezone = Asia/Dhaka
; ⚠ Matches config('app.timezone'). The application already sets its own
; timezone, but leaving PHP on UTC here makes any raw date() call disagree with
; every Carbon call — and this project has already lost time to punches and web
; clock-ins sitting six hours apart in the same column.

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; ⚠ validate_timestamps=0 means PHP never re-reads a changed file. That is the
; right production setting, and it means A CODE DEPLOY REQUIRES RESTARTING THE
; app/worker/scheduler CONTAINERS — editing files in place will appear to do
; nothing at all.

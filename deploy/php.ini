; Production PHP settings for the ERP image.

memory_limit = 512M
; The monthly attendance register is employees × days and the payroll variance
; report streams via LazyCollection — but dompdf renders a payslip fully in
; memory, which is what actually sets this floor.

max_execution_time = 300
post_max_size = 260M
upload_max_filesize = 256M
; ZKTeco CSV imports, employee document uploads (NID scans, contracts) and, from
; 30 Aug 2026, the document archive - which accepts video, so the old 20M was
; the real ceiling regardless of what the application validated.
;
; ⚠⚠ post_max_size MUST EXCEED upload_max_filesize. The post carries the file
; PLUS the form fields around it, so setting them equal makes a file at exactly
; the limit fail - and it fails as an EMPTY $_POST with no error, which looks
; like the form silently did nothing rather than like a size problem.
;
; ⚠ These are only two of the three ceilings. nginx's client_max_body_size caps
; the same request independently and must be raised with them; when it is lower
; the request never reaches PHP at all and the user gets a bare 413 instead of
; the application's own message.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; Container convention: logs go to the Docker log driver, not a file inside a
; layer nobody will look at.

date.timezone = Asia/Dhaka
; ⚠ Matches config('app.timezone'). The application already sets its own
; timezone, but leaving PHP on UTC here makes any raw date() call disagree with
; every Carbon call — and this project has already lost time to punches and web
; clock-ins sitting six hours apart in the same column.

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; ⚠ validate_timestamps=0 means PHP never re-reads a changed file. That is the
; right production setting, and it means A CODE DEPLOY REQUIRES RESTARTING THE
; app/worker/scheduler CONTAINERS — editing files in place will appear to do
; nothing at all.

session.upload_progress.enabled = Off
; ⚠⚠ Security, 24 Oct 2026: the upload-progress handler is the confirmed attack
; path for PHP2Shell (CVE-2026-109618 / CVE-2026-109619, fixed in 8.3.36) and
; for CVE-2026-115560, which no release fixes yet. Nothing in the ERP reads
; upload progress, so Off costs nothing. Keep it Off even on patched images.

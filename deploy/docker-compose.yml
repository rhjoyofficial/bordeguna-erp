# Bor de Guna ERP — production stack. Serves https://erp.bordeguna.com.
#
# ⚠⚠ THIS STACK IS MANAGED BY HAND AND WILL NOT APPEAR IN HOSTINGER'S hPANEL.
# The other four stacks on this host (traefik-rsf3, n8n-vb99, postgresql-4jjn,
# content-render-b7k2) were created by hPanel's one-click installer and have no
# compose files on disk. This one lives in the repository instead. Never edit
# Traefik's own configuration to accommodate this stack; it declares labels and
# Traefik picks them up, which is the whole point of the pattern.
#
# ⚠ TRAEFIK RUNS ON THE HOST NETWORK. It therefore reaches these containers by
# their bridge IP directly, and this stack needs NO shared network with it.
# That is why `internal` below is a plain private bridge with nothing else on
# it: n8n and Hermes have no path in, and this stack has no path out to them.
#
# Rollback at any point: `docker compose down`. Nothing outside
# /opt/bordeguna-erp is modified.

name: bordeguna-erp

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Live dashboards: Vite compiles the browser's socket settings in at
      # build time (docs/REVERB-DEPLOY.md). Empty key = the dashboards fall
      # back to refreshing on a timer; nothing breaks.
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${REVERB_PUBLIC_HOST:-erp.bordeguna.com}
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    image: bordeguna-erp:latest
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - storage:/var/www/html/storage
      # Shared with `web`, which is plain nginx and has none of these files.
      # The entrypoint republishes it on every start so a redeploy is not
      # serving the previous release's compiled assets.
      - public:/var/www/html/public
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    # 2 cores are shared with n8n. An unbounded PHP-FPM pool during a payroll
    # calculation could otherwise take the machine, which is exactly what this
    # deployment is supposed to be incapable of.
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 768M}

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
      - public:/var/www/html/public:ro
    networks: [internal]
    depends_on: [app]
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 128M}
    labels:
      # The only service in this stack Traefik is allowed to see. `db`, `worker`
      # and `scheduler` carry no labels and `exposedbydefault=false` on the
      # Traefik side means they stay unreachable rather than relying on us not
      # to publish ports.
      - traefik.enable=true
      # erp.bordeguna.com is the ONLY hostname this stack answers on, from
      # 6 Sep 2026. The old provider hostname was removed deliberately: Traefik
      # has no route for it and answers 404.
      - traefik.http.routers.bordeguna-erp.entrypoints=websecure
      - traefik.http.routers.bordeguna-erp.rule=Host(`erp.bordeguna.com`)
      - traefik.http.routers.bordeguna-erp.tls.certresolver=letsencrypt
      - traefik.http.routers.bordeguna-erp-http.entrypoints=web
      - traefik.http.routers.bordeguna-erp-http.rule=Host(`erp.bordeguna.com`)
      - traefik.http.routers.bordeguna-erp-http.middlewares=bordeguna-erp-redirect
      - traefik.http.middlewares.bordeguna-erp-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.bordeguna-erp-redirect.redirectscheme.permanent=true
      - traefik.http.services.bordeguna-erp.loadbalancer.server.port=80

  db:
    image: mysql:8.0
    restart: unless-stopped
    # ⚠ Deliberately NOT the existing postgresql-4jjn. A shared database is a
    # shared failure: a runaway payroll query or a bad migration would become
    # n8n's problem too. A few hundred MB of RAM buys complete separation.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Bangla names and addresses are stored throughout. utf8mb4 is not
      # optional here, and MySQL's historical "utf8" is not it.
    volumes:
      - dbdata:/var/lib/mysql
    networks: [internal]
    # ⚠ No published ports. The database is reachable only from this stack's
    # own bridge.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 1G}

  worker:
    image: bordeguna-erp:latest
    restart: unless-stopped
    env_file: [.env]
    command: php artisan queue:work --tries=1 --max-time=3600 --sleep=3 --timeout=110
    # ⚠⚠ 14 Oct 2026 (audit #28): DEPLOYS CUT LONG JOBS OFF AFTER 10 SECONDS.
    # `docker compose up -d` sends SIGTERM and, by default, SIGKILLs 10 seconds
    # later. queue:work answers SIGTERM by finishing the job in hand and then
    # exiting, so the 10 seconds were all a bulk booking or a payroll run got.
    # The three numbers must stay in this order:
    #   --timeout 110  <  stop_grace_period 120s  <  retry_after 1900 (config/queue.php)
    # A job without its own $timeout is killed by the worker at 110 s, inside
    # the grace period, so it fails cleanly instead of being SIGKILLed; and
    # nothing is handed to a second worker while it may still be running.
    # ⚠ Jobs that declare a longer $timeout (CalculatePayrollRunJob 900,
    # RenderReportJob 900, BookParcelsInBulk 1800) override --timeout: one
    # still running 120 s into a deploy is killed. Deploy when the queue is
    # idle (`docker compose exec worker php artisan queue:monitor` or the jobs
    # table), or raise the grace period to cover them.
    stop_grace_period: 120s
    volumes:
      - storage:/var/www/html/storage
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    # --tries=1 matches RenderReportJob's existing setting: these jobs restore
    # tenant context by hand and a blind retry is not automatically safe.
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 512M}

  # Live dashboards (Laravel Reverb). Behind the `realtime` profile so it only
  # starts once deploy/.env carries the REVERB_* keys and COMPOSE_PROFILES=realtime
  # (docs/REVERB-DEPLOY.md). Internal bridge only: nginx forwards /app and /apps.
  reverb:
    image: bordeguna-erp:latest
    profiles: [realtime]
    restart: unless-stopped
    env_file: [.env]
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    init: true
    volumes:
      - storage:/var/www/html/storage
    networks: [internal]
    depends_on: [app]
    deploy:
      resources:
        limits: {cpus: '0.25', memory: 192M}

  scheduler:
    image: bordeguna-erp:latest
    restart: unless-stopped
    env_file: [.env]
    command: php artisan schedule:work
    # ⚠⚠ A REAPER AS PID 1. `schedule:work` runs as PID 1 and never waits for
    # the children of `runInBackground()` commands, so each one stays a zombie.
    # HQ's scheduler, built the same way, reached its pids limit this way on
    # 18 Sep 2026 and ran nothing for three days (HQ docs/81 C.8). This one
    # gathers only a handful a day and every deploy recreates it, but the
    # limit is the same; `init: true` puts docker-init in front to reap them.
    init: true
    volumes:
      - storage:/var/www/html/storage
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    # ⚠⚠ THIS CONTAINER IS THE POINT OF THE C15 SLICE. `schedule:work` keeps its
    # own minute timer, so no host cron is needed — and none is possible, since
    # there is no PHP on this host and installing it would break the isolation
    # this stack exists to preserve.
    #
    # ⚠ DELIBERATELY SEPARATE FROM `worker`. A stuck queue job must never be
    # able to stop attendance being processed; sharing one container would make
    # exactly that possible.
    #
    # Verification that it is working: rows appearing in
    # `attendance_processing_runs` without anybody running a command. An empty
    # table means this container is not doing its job.
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 384M}

  backup:
    image: mysql:8.0
    restart: unless-stopped
    env_file: [.env]
    entrypoint: ['/bin/bash', '/backup.sh']
    volumes:
      - ./backup.sh:/backup.sh:ro
      - /root/backups/bordeguna-erp:/backups
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    # ⚠ On-server backups only — same disk as the database. This protects
    # against a bad migration, a dropped table or a corrupt row, NOT against
    # losing the VPS. The `offsite` service below is what closes that gap; this
    # one is still the first link, because offsite replicates these dumps.
    deploy:
      resources:
        limits: {cpus: '0.25', memory: 256M}

  # Encrypted offsite replication to Backblaze B2 (restic). Runs at 02:00 UTC,
  # an hour after the dump above, and is deliberately a SEPARATE container: a
  # failure to reach B2 must never stop the local dump being taken.
  #
  # ⚠ Reads /backups read-only. It replicates what the backup container
  # produced; it never produces a dump of its own, so there is exactly one
  # definition of what a good dump is.
  offsite:
    image: restic/restic:0.17.3
    # ⚠ Behind a profile, so a plain `docker compose up -d` does NOT start it.
    # Without this it comes up on every deploy and crash-loops against missing
    # B2 credentials, which is exactly what happened on 2026-08-01. Joy has
    # postponed offsite backup, so the stack must deploy cleanly without it.
    #
    # To enable, once B2_ACCOUNT_ID and B2_ACCOUNT_KEY are in .env:
    #   docker compose --profile offsite up -d
    profiles: ["offsite"]
    restart: unless-stopped
    env_file: [.env]
    entrypoint: ['/bin/sh', '/offsite.sh']
    volumes:
      - ./offsite.sh:/offsite.sh:ro
      - /root/backups/bordeguna-erp:/backups:ro
      # restic's cache. Persisted so a nightly run does not re-download the
      # repository index every time.
      - resticcache:/root/.cache/restic
    networks: [internal]
    deploy:
      resources:
        limits: {cpus: '0.25', memory: 512M}

networks:
  internal:
    driver: bridge

volumes:
  dbdata:
  storage:
  public:
  resticcache:

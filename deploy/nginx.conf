# Container-local nginx for the ERP. Traefik terminates TLS and forwards here
# over plain HTTP on the private bridge, so this server block does no TLS of
# its own and must not redirect to https itself — Traefik already does that at
# the `web` entrypoint, and a second redirect here would loop.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Payslip PDFs, xlsx exports and the monthly attendance register are all
    # streamed, and the register is employees × days. The default 60s is not
    # generous enough for a full-year export on a 2-core box.
    fastcgi_read_timeout 300;

    # Payroll input forms, CSV punch imports and the document archive, which
    # accepts video (Joy, 30 Aug 2026).
    #
    # ⚠⚠ THIS IS THE FIRST CEILING A LARGE UPLOAD MEETS, and it is the cruellest
    # one: nginx rejects the request before PHP is reached, so Laravel's own
    # validation message never runs and the user sees a bare 413 page. It must
    # be kept at or above php.ini's post_max_size, and above whatever the
    # application validates - see FileManagerController::store.
    client_max_body_size 260M;

    # Traefik sets these; without them Laravel builds URLs as http:// and the
    # Inertia asset links break under HTTPS.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ⚠⚠ DOCKER'S EMBEDDED DNS, AND A VARIABLE UPSTREAM. BOTH ARE REQUIRED.
    #
    # With a literal `fastcgi_pass app:9000`, nginx resolves `app` ONCE at
    # startup and caches the IP for the life of the process. Recreating the app
    # container — which every deploy does — gives it a NEW bridge IP, and nginx
    # keeps dialling the old one:
    #
    #   connect() failed (111: Connection refused) while connecting to upstream,
    #   upstream: "fastcgi://172.16.3.6:9000"
    #
    # The site then returns 502 until `web` is restarted too. That happened on
    # 2026-07-29 and would have happened on every subsequent deploy.
    #
    # nginx only re-resolves a name when the upstream is a VARIABLE, and it can
    # only do that if a resolver is configured. 127.0.0.11 is Docker's embedded
    # DNS server, present on every user-defined bridge network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Live dashboards: WebSocket upgrade to the reverb container (same variable
    # upstream + Docker DNS rule as php below). When reverb is not running the
    # browser simply falls back to refreshing widgets on a timer.
    location ~ ^/(app|apps)(/|$) {
        set $upstream_reverb reverb:8080;
        proxy_pass http://$upstream_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ⚠ `storage/` is the private attachment disk: employee NID scans, bank
    # documents and payslips live there, and every one of them is served
    # through an authenticated Laravel route that checks
    # ControlsAttachmentAccess. Serving it statically would hand out HR
    # documents to anyone who guessed a filename.
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
}
